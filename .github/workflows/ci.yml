name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (no model calls; Docker tests only on Linux)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then uv run --locked pytest -q; else uv run --locked pytest -q -m "not docker"; fi
      - name: Demo works with zero configuration
        run: uv run --locked rulelab demo --out demo.html && test -s demo.html
      - name: Build
        run: uv build
